name: lokko_market
description: "A district-level classifieds Lokko marketplace like Bikroy."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- MONETIZATION ---
  google_mobile_ads: ^8.0.0

  # --- NETWORKING & UTILS ---
  dio: ^5.4.1
  crypto: ^3.0.3
  http: ^1.2.0
  intl: ^0.20.2
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  app_links: ^6.0.0


  # --- SUPABASE CORE ---
  supabase_flutter: ^2.8.0

  # --- STATE MANAGEMENT ---
  flutter_riverpod: ^3.2.1

  # --- IMAGES & MEDIA ---
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # --- LOCATION & MAPS ---
  geolocator: ^14.0.2
  google_maps_flutter: ^2.5.3
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

  # --- UI COMPONENTS ---
  font_awesome_flutter: 10.7.0

  pinput: ^5.0.0
  google_nav_bar: ^5.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"
  # 🛠️ FIXED: Package Name Manager supports explicit activity renaming required on Dart 3.7+
  package_name_manager: ^1.0.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/placeholder.png
    - assets/images/ic_launcher.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/ic_launcher.png"