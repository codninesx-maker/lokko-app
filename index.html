<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lokko Market - Buy and sell locally.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lokko Market</title>
  <link rel="manifest" href="manifest.json">

  <script>
  window.addEventListener('DOMContentLoaded', (event) => {
    const hash = window.location.hash; // e.g. #/ad/12345
    if (hash.includes('/ad/')) {
      const isAndroid = /android/i.test(navigator.userAgent);
      const isiOS = /ipad|iphone|ipod/i.test(navigator.userAgent);

      if (isAndroid || isiOS) {
        const adId = hash.path ? hash : hash.split('/ad/')[1];
        
        const customSchemeUrl = `lokko://ad/${adId}`;
        const playStoreUrl = `https://play.google.com/store/apps/details?id=com.rxai.lokko_market`;

        if (isAndroid) {
          // Use Android Intent URI scheme to cleanly handle installed apps vs Play Store fallback
          const intentUri = `intent://ad/${adId}#Intent;scheme=lokko;package=com.rxai.lokko_market;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end;`;
          window.location.replace(intentUri);
        } else {
          // iOS fallback handling
          window.location.href = customSchemeUrl;
          setTimeout(() => {
            window.location.href = 'https://apps.apple.com/app/idYOUR_IOS_ID'; // update if iOS is needed later
          }, 1500);
        }
      }
    }
  });
</script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <p>Opening Lokko Market...</p>
  </div>
</body>
</html>
