<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lokko Market</title>
  <script type="text/javascript">
    window.onload = function() {
      const playStoreUrl = "https://play.google.com/store/apps/details?id=com.rxai.lokko";
      const fullUrl = window.location.href;
      const isAndroid = /android/i.test(navigator.userAgent);
      
      // Check if the URL contains an ad path (handles both /ad/ID and #/ad/ID)
      if (fullUrl.includes('/ad/')) {
        if (isAndroid) {
          // Extract the ad ID portion to pass into your custom scheme or intent
          const parts = fullUrl.split('/ad/');
          const adId = parts[1] ? parts[1].split('/')[0].split('?')[0] : '';
          
          if (adId) {
            const customSchemeUrl = "lokko://ad/" + adId;
            
            // Try launching the app directly to the post
            window.location.replace(customSchemeUrl);

            // Fallback to Play Store if the app isn't installed
            setTimeout(function() {
              window.location.href = playStoreUrl;
            }, 1500);
            return;
          }
        }
      }
      
      // Default fallback if no valid ad ID or not on Android
      window.location.href = playStoreUrl;
    };
  </script>
</head>
<body>
  <p>Redirecting to Lokko Market...</p>
</body>
</html>
