<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lokko Market - Buy and sell locally.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lokko Market</title>
  <link rel="manifest" href="manifest.json">

  <script>
  window.addEventListener('DOMContentLoaded', (event) => {
    const hash = window.location.hash; // e.g. #/ad/12345

    if (hash.includes('/ad/')) {
      const isAndroid = /android/i.test(navigator.userAgent);
      const isiOS = /ipad|iphone|ipod/i.test(navigator.userAgent);

      if (isAndroid || isiOS) {
        const adId = hash.split('/ad/')[1].replace('/', '');
        
        // 1. Try launching the custom app scheme
        window.location.href = `lokko://ad/${adId}`;

        // 2. Fallback to the full Play Store URL safely after a delay
        setTimeout(() => {
          window.location.replace('https://play.google.com/store/apps/details?id=com.rxai.lokko_market');
        }, 1200);
      }
    }
  });
</script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <p>Opening Lokko Market...</p>
  </div>
</body>
</html>
