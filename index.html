<script type="text/javascript">
    window.addEventListener('load', function() {
      const fullUrl = window.location.href;
      const playStoreUrl = "https://play.google.com/store/apps/details?id=com.rxai.lokko";
      const isAndroid = /android/i.test(navigator.userAgent);

      // Check if URL contains an ad route (supports standard paths and hash routes like /#/ad/)
      if (fullUrl.includes('/ad/')) {
        const parts = fullUrl.split('/ad/');
        const adId = parts[1] ? parts[1].split('/')[0].split('?')[0].split('#')[0] : '';

        if (adId && isAndroid) {
          const customSchemeUrl = "lokko://ad/" + adId;

          // Attempt to open the app directly to the post
          window.location.replace(customSchemeUrl);

          // Fallback to Play Store if the app isn't installed
          setTimeout(function() {
            window.location.href = playStoreUrl;
          }, 1500);
          return;
        }
      }

      // Standard Flutter bootstrap for normal web visitors...
      const scriptTag = document.createElement('script');
      scriptTag.src = 'flutter.js';
      scriptTag.type = 'application/javascript';
      scriptTag.onload = function() {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.run();
            });
          }
        });
      };
      document.body.appendChild(scriptTag);
    });
  </script>
