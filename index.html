<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lokko Market - Buy and sell locally.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lokko Market</title>
  <link rel="manifest" href="manifest.json">

  <script>
  window.addEventListener('DOMContentLoaded', (event) => {
    const hash = window.location.hash; // e.g. #/ad/12345
    if (hash.includes('/ad/')) {
      const isAndroid = /android/i.test(navigator.userAgent);
      const isiOS = /ipad|iphone|ipod/i.test(navigator.userAgent);

      if (isAndroid || isiOS) {
        const adId = hash.split('/ad/')[1];
        
        // 1. Custom app deep link for when the app is installed
        const customSchemeUrl = `lokko://ad/${adId}`;
        
        // 2. Correct Play Store fallback URLs
        const playStoreAppUrl = 'market://details?id=com.rxai.lokko_market';
        const playStoreWebUrl = 'https://play.google.com/store/apps/details?id=com.rxai.lokko_market';

        // Try opening the app first
        window.location.href = customSchemeUrl;

        // If not installed, fallback to Play Store after 1.5 seconds
        setTimeout(() => {
          if (isAndroid) {
            window.location.href = playStoreAppUrl;
            // Backup web URL fallback if market:// fails
            setTimeout(() => {
              window.location.href = playStoreWebUrl;
            }, 500);
          } else {
            window.location.href = playStoreWebUrl;
          }
        }, 1500);
      }
    }
  });
</script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <p>Opening Lokko Market...</p>
  </div>
</body>
</html>
