<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lokko Market - Buy and sell locally.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lokko Market</title>
  <link rel="manifest" href="manifest.json">

  <script>
  // Intercept shared post links on mobile browsers
  window.addEventListener('DOMContentLoaded', (event) => {
    const hash = window.location.hash; // e.g. #/ad/12345
    if (hash.includes('/ad/')) {
      const isAndroid = /android/i.test(navigator.userAgent);
      const isiOS = /ipad|iphone|ipod/i.test(navigator.userAgent);

      if (isAndroid || isiOS) {
        // Extract the ad ID from the hash
        const adId = hash.split('/ad/')[1];
        
        // Define your custom app scheme
        const customSchemeUrl = `lokko://ad/${adId}`;
        
        // Define your Google Play Store URL
        const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.rxai.lokko_market';

        // Attempt to launch the app via custom scheme
        window.location.href = customSchemeUrl;

        // If the app is not installed, redirect to Play Store after 1.5 seconds
        setTimeout(() => {
          window.location.href = playStoreUrl;
        }, 1500);
      }
    }
  });
</script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <p>Opening Lokko Market...</p>
  </div>
</body>
</html>
