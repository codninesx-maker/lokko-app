<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lokko Market - Buy and sell locally.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lokko Market</title>
  <link rel="manifest" href="manifest.json">

  <script>
  window.addEventListener('DOMContentLoaded', (event) => {
    const hash = window.location.hash; // e.g. #/ad/12345

    if (hash.includes('/ad/')) {
      const isAndroid = /android/i.test(navigator.userAgent);
      const isiOS = /ipad|iphone|ipod/i.test(navigator.userAgent);

      if (isAndroid) {
        const adId = hash.split('/ad/')[1].replace('/', '');
        
        // Use native Android Intent syntax to prevent URL truncation and 404s
        const intentUrl = `intent://ad/${adId}#Intent;scheme=lokko;package=com.rxai.lokko_market;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.rxai.lokko_market;end;`;
        window.location.replace(intentUrl);

      } else if (isiOS) {
        const adId = hash.split('/ad/')[1].replace('/', '');
        window.location.href = `lokko://ad/${adId}`;
        setTimeout(() => {
          window.location.replace('https://apps.apple.com/app/idYOUR_IOS_ID');
        }, 1200);
      }
    }
  });
</script>
</head>
<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <p>Opening Lokko Market...</p>
  </div>
</body>
</html>
