<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lokko Market</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // This script takes the current URL path and passes it to index.html via query parameter
    var segmentCount = 1; // Set to 1 for github.io/lokko-app/
    var l = window.location;
    
    window.location.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' + 
      l.pathname.slice(1).split('/').slice(segmentCount).join('/') + l.search + l.hash
    );
  </script>
</head>
<body>
</body>
</html>
